version: "3.9"

services:
  devopsdb:
    container_name: dbcont
    image: shaikmustafa/deepika:db
    ports:
      - "3306:3306"
    deploy:
      replicas: 1
    networks:
      - mynetwork

  application:
    container_name: appcont
    image: shaikmustafa/deepika:app
    ports:
      - "1111:8080"
    deploy:
      replicas: 1
    depends_on:
      - devopsdb
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: bridge
